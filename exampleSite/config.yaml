baseurl: "https://example.com/"
languageCode: "cn-zh"
defaultContentLanguage: "zh"
title: "Hugo Zen"
theme: "hugo-zen"
googleAnalytics: ""
enableEmoji: true
footnotereturnlinkcontents: "↩"

permalinks:
  note: "/note/:year/:month/:day/:slug/"
  post: "/post/:year/:month/:day/:slug/"

outputs:
  home: ["HTML", "RSS", "JSON"]

menu:
  main:
    - name: Home
      url: "/"
      weight: 1
    - name: Posts
      url: "post/"
      weight: 2
    - name: Tags
      url: "tags/"
      weight: 3
    - name: Note
      url: "note/"
      weight: 4
    - name: About
      url: "about/"
      weight: 5
    - name: Subscribe
      url: "index.xml"
      weight: 6

params:
  description: "A minimalist Hugo website powered by hugo-zen."
  footer: "&copy; powered by [Hugo](https://gohugo.io/) & [Hugo Zen](https://github.com/qiref/hugo-zen) 2017 -- {Year}"
  homePostLimit: 25
  enableHeatmap: true
  enableSearch: true
  utterances:
    repo: ""
    issueTerm: "pathname"
    label: "Comment"
    theme: "github-light"

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  highlight:
    codeFences: true
    noClasses: false
    guessSyntax: false
    tabWidth: 4
  goldmark:
    renderer:
      unsafe: true
